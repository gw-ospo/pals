[project]
name = "pals"
version = "0.1.0"
description = "PALS: PAC Analysis of Legislative Scorecards"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "jupyter>=1.1", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
